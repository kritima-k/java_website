/* =====================================================
   CREATE QUESTION BUTTONS AND CONTENT
===================================================== */

questions.forEach(function(question, index) {

    const number = index + 1;


    /* -------------------------------------------------
       CREATE SIDEBAR BUTTON
    ------------------------------------------------- */

    const button =
        document.createElement("button");

    button.className =
        "question-btn";

    if(number === 1)
    {
        button.classList.add("active");
    }

    button.textContent =
        "Question " + number;

    button.onclick = function()
    {
        showQuestion(number);
    };

    document
        .getElementById("questionList")
        .appendChild(button);



    /* -------------------------------------------------
       CREATE QUESTION PAGE
    ------------------------------------------------- */

    const section =
        document.createElement("section");

    section.className =
        "question-page";

    section.id =
        "question" + number;

    if(number === 1)
    {
        section.classList.add("active");
    }



    /* -------------------------------------------------
       QUESTION HEADING
    ------------------------------------------------- */

    const heading =
        document.createElement("h2");

    heading.textContent =
        "Question " + number;



    /* -------------------------------------------------
       QUESTION BOX
    ------------------------------------------------- */

    const questionBox =
        document.createElement("div");

    questionBox.className =
        "question-box";

    questionBox.textContent =
        question;



    /* -------------------------------------------------
       JAVA PROGRAM BOX
    ------------------------------------------------- */

    const programBox =
        document.createElement("div");

    programBox.className =
        "program-box";


    const programHeader =
        document.createElement("div");

    programHeader.className =
        "program-header";


    const programTitle =
        document.createElement("h3");

    programTitle.textContent =
        "Java Program";


    const javaLabel =
        document.createElement("span");

    javaLabel.className =
        "java-label";

    javaLabel.textContent =
        ".java";


    programHeader.appendChild(programTitle);

    programHeader.appendChild(javaLabel);



    /* -------------------------------------------------
       CODE AREA
    ------------------------------------------------- */

    const codeArea =
        document.createElement("div");

    codeArea.className =
        "code-area";


    const code =
        document.createElement("pre");

    code.id =
        "javaCode" + number;

    code.textContent =
        "Loading Q" + number + ".java...";


    codeArea.appendChild(code);

    programBox.appendChild(programHeader);

    programBox.appendChild(codeArea);



    /* -------------------------------------------------
       OUTPUT BOX
    ------------------------------------------------- */

    const outputBox =
        document.createElement("div");

    outputBox.className =
        "output-box";


    const outputHeader =
        document.createElement("div");

    outputHeader.className =
        "output-header";

    outputHeader.textContent =
        "Output";


    const outputContent =
        document.createElement("div");

    outputContent.className =
        "output-content";

    outputContent.textContent =
        outputs[index];


    outputBox.appendChild(outputHeader);

    outputBox.appendChild(outputContent);



    /* -------------------------------------------------
       ADD EVERYTHING TO QUESTION PAGE
    ------------------------------------------------- */

    section.appendChild(heading);

    section.appendChild(questionBox);

    section.appendChild(programBox);

    section.appendChild(outputBox);


    document
        .getElementById("content")
        .appendChild(section);

});



/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(number)
{

    const pages =
        document.querySelectorAll(
            ".question-page"
        );


    pages.forEach(function(page)
    {
        page.classList.remove("active");
    });



    const buttons =
        document.querySelectorAll(
            ".question-btn"
        );


    buttons.forEach(function(button)
    {
        button.classList.remove("active");
    });



    const selectedPage =
        document.getElementById(
            "question" + number
        );


    if(selectedPage)
    {
        selectedPage.classList.add("active");
    }



    if(buttons[number - 1])
    {
        buttons[number - 1]
            .classList.add("active");
    }



    document
        .querySelector(".content")
        .scrollTop = 0;

}



/* =====================================================
   FETCH JAVA PROGRAMS AUTOMATICALLY
===================================================== */

questions.forEach(function(question, index)
{

    const number =
        index + 1;


    fetch("Q" + number + ".java")

        .then(function(response)
        {

            if(!response.ok)
            {
                throw new Error(
                    "Unable to load Q" +
                    number +
                    ".java"
                );
            }

            return response.text();

        })

        .then(function(code)
        {

            document.getElementById(
                "javaCode" + number
            ).textContent = code;

        })

        .catch(function(error)
        {

            document.getElementById(
                "javaCode" + number
            ).textContent =
                "Unable to load Q" +
                number +
                ".java";

            console.error(error);

        });

});
