/*
 * =====================================================
 * CREATE SIDEBAR BUTTONS AND QUESTION PAGES
 * =====================================================
 */

const questionList =
    document.getElementById("questionList");

const content =
    document.getElementById("content");


questions.forEach(function(question, index) {

    const number = index + 1;


    /*
     * -------------------------------------------------
     * CREATE SIDEBAR BUTTON
     * -------------------------------------------------
     */

    const button =
        document.createElement("button");

    button.className =
        "question-btn";

    if(number === 1) {

        button.classList.add("active");

    }

    button.textContent =
        "Question " + number;

    button.onclick = function() {

        showQuestion(number);

    };

    questionList.appendChild(button);


    /*
     * -------------------------------------------------
     * CREATE QUESTION PAGE
     * -------------------------------------------------
     */

    const section =
        document.createElement("section");

    section.className =
        "question-page";

    if(number === 1) {

        section.classList.add("active");

    }

    section.id =
        "question" + number;


    /*
     * -------------------------------------------------
     * QUESTION HEADING
     * -------------------------------------------------
     */

    const heading =
        document.createElement("h1");

    heading.className =
        "question-heading";

    heading.innerHTML =
        'Question <span>' +
        String(number).padStart(2, "0") +
        '</span>';


    /*
     * -------------------------------------------------
     * QUESTION BOX
     * -------------------------------------------------
     */

    const questionBox =
        document.createElement("div");

    questionBox.className =
        "question-box";


    const boxTitle =
        document.createElement("div");

    boxTitle.className =
        "box-title";

    boxTitle.textContent =
        "Question";


    const questionText =
        document.createElement("div");

    questionText.className =
        "question-placeholder";

    questionText.textContent =
        question;


    questionBox.appendChild(boxTitle);

    questionBox.appendChild(questionText);


    /*
     * -------------------------------------------------
     * JAVA PROGRAM BOX
     * -------------------------------------------------
     */

    const programBox =
        document.createElement("div");

    programBox.className =
        "program-box";


    const programHeader =
        document.createElement("div");

    programHeader.className =
        "program-header";


    const programTitle =
        document.createElement("h3");

    programTitle.textContent =
        "Java Program";


    const javaLabel =
        document.createElement("span");

    javaLabel.className =
        "java-label";

    javaLabel.textContent =
        ".java";


    programHeader.appendChild(programTitle);

    programHeader.appendChild(javaLabel);


    const codeArea =
        document.createElement("div");

    codeArea.className =
        "code-area";


    const code =
        document.createElement("pre");

    code.id =
        "javaCode" + number;

    code.textContent =
        programFiles[index]
            ? "Loading " + programFiles[index] + "..."
            : "Program skipped.";


    codeArea.appendChild(code);


    programBox.appendChild(programHeader);

    programBox.appendChild(codeArea);


    /*
     * -------------------------------------------------
     * OUTPUT BOX
     * -------------------------------------------------
     */

    const outputBox =
        document.createElement("div");

    outputBox.className =
        "output-box";


    const outputHeader =
        document.createElement("div");

    outputHeader.className =
        "output-header";

    outputHeader.textContent =

    const outputContent =
        document.createElement("div");

    outputContent.className =
        "output-content";


    /*
     * Add the recorded output.
     */

    if(number === 12) {

        outputContent.textContent =
            outputs[index];

    }
    else if(outputs[index]) {

        outputContent.textContent =
            outputs[index];

    }
    else {

        outputContent.textContent =
            "Program skipped.";

    }


    outputBox.appendChild(outputHeader);

    outputBox.appendChild(outputContent);


    /*
     * -------------------------------------------------
     * ADD EVERYTHING TO SECTION
     * -------------------------------------------------
     */

    section.appendChild(heading);

    section.appendChild(questionBox);

    section.appendChild(programBox);

    section.appendChild(outputBox);


    content.appendChild(section);

});


/*
 * =====================================================
 * SHOW QUESTION
 * =====================================================
 */

function showQuestion(number) {

    const questions =
        document.querySelectorAll(".question-page");


    questions.forEach(function(question) {

        question.classList.remove("active");

    });


    const buttons =
        document.querySelectorAll(".question-btn");


    buttons.forEach(function(button) {

        button.classList.remove("active");

    });


    const selectedQuestion =
        document.getElementById(
            "question" + number
        );


    if(selectedQuestion) {

        selectedQuestion.classList.add("active");

    }


    if(buttons[number - 1]) {

        buttons[number - 1].classList.add("active");

    }


    document.querySelector(".content").scrollTop = 0;

}


/*
 * =====================================================
 * FETCH JAVA PROGRAMS AUTOMATICALLY
 * =====================================================
 */

programFiles.forEach(function(file, index) {

    const number = index + 1;


    if(!file) {

        return;

    }


    fetch(file)

        .then(function(response) {

            if(!response.ok) {

                throw new Error(
                    "Unable to load " + file
                );

            }

            return response.text();

        })

        .then(function(code) {

            document.getElementById(
                "javaCode" + number
            ).textContent = code;

        })

        .catch(function(error) {

            document.getElementById(
                "javaCode" + number
            ).textContent =
                "Unable to load " + file;

            console.error(error);

        });

});
